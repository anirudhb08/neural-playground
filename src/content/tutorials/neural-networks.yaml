title: Neural networks, explained by building one
blurb: >-
  Invent an alphabet that has never existed, draw it by hand, and train a
  neural network to read your handwriting — in your browser, with every number
  visible at every step.
outcome: >-
  You will have written a loss function and a training loop by hand, in Python,
  and watched a network learn to read characters you invented.
order: 1
published: 2026-07-26
status: published
plateCaption: >-
  A trained scorecard for one invented character, after 400 steps. Teal counts
  for the character, pink against it. Nobody drew this — the network worked it
  out, and you can see the letter in it.
