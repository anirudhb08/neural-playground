title: A tiny GPT, built from scratch
blurb: >-
  Start by counting which letter follows which, and end with a transformer.
  Every piece hand-written before any library version is allowed near it.
outcome: >-
  You will have built a character-level language model a piece at a time, and
  will know why each piece had to exist — because you will have watched the
  version without it fail.
order: 2
published: 2026-08-02
status: published
plateCaption: >-
  A real bigram table: for each of the sixteen commonest characters in part one,
  how often every other character followed it. Nothing learned this — it is a
  tally. Part one builds it from any text you type.
